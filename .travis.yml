sudo: true
language: haskell


git:
  depth: 5


cache:
  directories:
  - "$HOME/.stack"
  - "$PWD/.stack-work"


matrix:
  include:

  - ghc: 8.0.2
    env: GHCVER='8.0.2' STACK_YAML="$PWD/stack.yaml"


addons:
  apt:
    sources:
      - sourceline: 'ppa:hvr/ghc'
    packages:
      - libgmp-dev
      - cabal-install-2.0


before_install:

  - mkdir -p "$HOME/.local/bin"
  - export PATH="$HOME/.local/bin:$PATH"
  - travis_retry curl -L 'https://www.stackage.org/stack/linux-x86_64' | tar xz --wildcards --strip-components=1 -C "$HOME/.local/bin" '*/stack'
  - stack --version


install:

  - travis_wait 30 stack setup --no-terminal
  - stack ghc -- --version

  - travis_wait 40 stack build --only-dependencies --no-terminal
  - travis_wait 40 stack build --test --bench --haddock --no-run-tests --no-run-benchmarks --no-haddock-deps --no-terminal


script:

    - stack build --test --bench --no-terminal --flag 'time-warp:build-executables'


notifications:
  email: false
  slack:
    rooms:
      - serokell:Lk0GI0786tPYo9Nve9SSuPOf
    on_success: change
    on_failure: always
